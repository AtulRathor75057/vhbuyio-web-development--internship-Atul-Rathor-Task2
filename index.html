<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Figma Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="editor">

    <!-- Top Toolbar -->
    <header class="top-toolbar">

        <div class="logo">
            MiniFigma
        </div>

        <div class="toolbar-tools">

            <button class="tool-btn active" data-tool="select" title="Select (V)">
                ↖
            </button>

            <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
                □
            </button>

            <button class="tool-btn" data-tool="ellipse" title="Ellipse (O)">
                ○
            </button>

            <button class="tool-btn" data-tool="line" title="Line (L)">
                ╱
            </button>

            <button class="tool-btn" data-tool="text" title="Text (T)">
                T
            </button>

        </div>

        <div class="toolbar-actions">

            <button id="undoBtn" title="Undo">
                ↶
            </button>

            <button id="redoBtn" title="Redo">
                ↷
            </button>

            <button id="exportBtn">
                Export
            </button>

        </div>

    </header>


    <!-- Main Editor -->
    <main class="main-area">

        <!-- Left Sidebar -->
        <aside class="left-sidebar">

            <div class="sidebar-title">
                Tools
            </div>

            <button class="side-tool active" data-tool="select">
                <span>↖</span>
                Select
            </button>

            <button class="side-tool" data-tool="rectangle">
                <span>□</span>
                Rectangle
            </button>

            <button class="side-tool" data-tool="ellipse">
                <span>○</span>
                Ellipse
            </button>

            <button class="side-tool" data-tool="line">
                <span>╱</span>
                Line
            </button>

            <button class="side-tool" data-tool="text">
                <span>T</span>
                Text
            </button>

        </aside>


        <!-- Canvas Area -->
        <section class="canvas-area">

            <canvas id="editorCanvas"></canvas>

        </section>


        <!-- Right Panel -->
        <aside class="right-panel">

            <!-- Layers -->
            <section class="layers-panel">

                <div class="panel-header">
                    <span>Layers</span>
                </div>

                <div id="layersList" class="layers-list">
                    <div class="empty-layers">
                        No objects
                    </div>
                </div>

            </section>


            <!-- Properties -->
            <section class="properties-panel">

                <div class="panel-header">
                    Properties
                </div>

                <div id="propertiesContent" class="properties-content">

                    <div class="no-selection">
                        Select an object
                    </div>

                </div>

            </section>

        </aside>

    </main>


    <!-- Bottom Status Bar -->
    <footer class="status-bar">

        <div>
            <span id="objectCount">0 objects</span>
        </div>

        <div class="zoom-controls">

            <button id="zoomOut">−</button>

            <span id="zoomValue">100%</span>

            <button id="zoomIn">+</button>

        </div>

    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
